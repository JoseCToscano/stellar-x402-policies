[package]
name = "period-cap-policy"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "Smart-account policy that caps transfers on a fixed ledger calendar."

[lib]
crate-type = ["cdylib", "rlib"]
