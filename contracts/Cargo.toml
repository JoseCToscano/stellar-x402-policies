[workspace]
resolver = "2"
members = ["merchant-allowlist-policy", "period-cap-policy"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
